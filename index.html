<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOREBEUS 演出資訊總覽</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'system-ui', '-apple-system', 'sans-serif'],
            display: ['"Space Grotesk"', '"Noto Sans TC"', 'sans-serif'],
          },
          colors: {
            warm: {
              bg: '#FAF8F6',
              surface: '#FFFFFF',
              tint: '#FDF6F3',
              border: '#E7E0D8',
              text: '#1F1715',
              muted: '#6E615B',
              subtle: '#9C8E87',
            },
            crimson: {
              50: '#FEF2F2',
              100: '#FEE2E2',
              200: '#FECACA',
              500: '#EF4444',
              600: '#DC2626',
              700: '#B91C1C',
              800: '#991B1B',
              900: '#7F1D1D',
            }
          }
        }
      }
    };
  </script>
  <style>
    body { background-color: #FAF8F6; color: #1F1715; -webkit-font-smoothing: antialiased; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fadeSlide { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-card { animation: fadeSlide 0.24s ease-out both; }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-crimson-100 selection:text-crimson-900">

  <!-- Top Navigation Bar -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-warm-border">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-crimson-700 to-rose-600 text-white flex items-center justify-center shrink-0 shadow-sm shadow-crimson-900/15">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18.178 8c5.096 0 5.096 8 0 8-5.095 0-7.133-8-12.739-8-4.585 0-4.585 8 0 8 5.606 0 7.644-8 12.74-8z" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="truncate">
          <div class="flex items-center gap-2">
            <h1 id="siteTitleDisplay" class="font-display font-bold text-lg sm:text-xl tracking-tight text-warm-text truncate">MOREBEUS</h1>
            <span class="hidden sm:inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-crimson-50 text-crimson-700 border border-crimson-200/80">
              雲端同步版
            </span>
          </div>
          <p id="siteSubtitleDisplay" class="text-xs text-warm-muted truncate">2026 Live Schedule &amp; Event Info</p>
        </div>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <button
          id="toggleEditModeBtn"
          type="button"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium border border-warm-border bg-white text-warm-text hover:bg-warm-tint hover:border-crimson-200 transition-colors cursor-pointer"
        >
          <svg class="w-4 h-4 text-crimson-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="editModeLabel">編輯模式</span>
        </button>

        <button
          id="openAddModalBtn"
          type="button"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium bg-crimson-700 text-white hover:bg-crimson-800 transition-colors shadow-sm shadow-crimson-900/15 cursor-pointer"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M12 5v14M5 12h14" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>新增演出</span>
        </button>

        <!-- More Menu -->
        <div class="relative">
          <button
            id="moreMenuBtn"
            type="button"
            title="更多選項"
            class="p-1.5 sm:p-2 rounded-lg border border-warm-border bg-white text-warm-muted hover:text-crimson-700 hover:bg-warm-tint transition-colors cursor-pointer"
          >
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/>
            </svg>
          </button>
          <div id="moreMenuDropdown" class="hidden absolute right-0 mt-2 w-56 rounded-xl bg-white border border-warm-border shadow-lg shadow-stone-900/10 py-1.5 z-40 text-sm">
            <button id="editHeaderInfoBtn" type="button" class="w-full px-3.5 py-2 text-left text-warm-text hover:bg-warm-tint flex items-center gap-2.5 cursor-pointer">
              <svg class="w-4 h-4 text-crimson-700 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h10M4 17h7" stroke-linecap="round"/></svg>
              <span>修改標題與公告列</span>
            </button>
            <button id="forceSyncBtn" type="button" class="w-full px-3.5 py-2 text-left text-warm-text hover:bg-warm-tint flex items-center gap-2.5 cursor-pointer">
              <svg class="w-4 h-4 text-crimson-700 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.73-5.73" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span>重新從雲端同步資料</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Edit Mode Notice Banner -->
  <div id="editBanner" class="hidden bg-crimson-50 border-b border-crimson-200/80">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-2.5 flex flex-wrap items-center justify-between gap-2 text-xs sm:text-sm text-crimson-900">
      <div class="flex items-center gap-2">
        <span class="inline-block w-2 h-2 rounded-full bg-crimson-600 animate-pulse"></span>
        <span><strong>雲端編輯模式：</strong>修改或新增演出後點擊儲存，將直接同步至雲端，所有人重新整理即可看到！</span>
      </div>
      <button id="bannerCloseEditBtn" type="button" class="px-2.5 py-1 rounded-md bg-white border border-crimson-200 text-crimson-800 text-xs font-medium hover:bg-crimson-100 cursor-pointer">
        完成編輯
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-6">

    <!-- Announcement Bar -->
    <section class="bg-white border border-warm-border rounded-2xl p-4 sm:p-5 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-3 relative overflow-hidden">
      <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-gradient-to-b from-crimson-700 to-amber-600"></div>
      <div class="space-y-1 pl-2">
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold bg-crimson-700 text-white tracking-wide">
            公告 INFO
          </span>
          <span id="lastUpdatedLabel" class="text-xs text-warm-muted">最後更新：--</span>
        </div>
        <p id="announcementText" class="text-sm text-warm-text leading-relaxed">
          載入中...
        </p>
      </div>
      <div class="flex items-center gap-3 shrink-0 text-xs text-warm-muted border-t sm:border-t-0 pt-2.5 sm:pt-0 border-warm-border pl-2 sm:pl-0">
        <div class="px-3 py-1.5 rounded-lg bg-warm-tint border border-warm-border/70">
          <span>總場次</span><strong id="totalCountStat" class="ml-1.5 text-sm font-display text-warm-text">0</strong>
        </div>
        <div class="px-3 py-1.5 rounded-lg bg-crimson-50/70 border border-crimson-200/70">
          <span class="text-crimson-800">即將演出</span><strong id="upcomingCountStat" class="ml-1.5 text-sm font-display text-crimson-700">0</strong>
        </div>
      </div>
    </section>

    <!-- Search & Filter Controls -->
    <section class="space-y-3">
      <div class="flex flex-col sm:flex-row gap-2.5">
        <div class="relative flex-1">
          <svg class="w-4 h-4 text-warm-subtle absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35" stroke-linecap="round"/></svg>
          <input id="searchInput" type="text" placeholder="搜尋活動名稱、場館、共演樂團或歌單曲目..." class="w-full pl-10 pr-9 py-2.5 rounded-xl bg-white border border-warm-border text-sm text-warm-text placeholder:text-warm-subtle focus:outline-none focus:border-crimson-600 focus:ring-2 focus:ring-crimson-100 transition-all" />
          <button id="clearSearchBtn" type="button" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 p-1 text-warm-subtle hover:text-crimson-700 cursor-pointer">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="inline-flex rounded-xl bg-white border border-warm-border p-1 shrink-0">
          <button type="button" data-time-filter="all" class="time-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-crimson-700 text-white transition-colors cursor-pointer">全部場次</button>
          <button type="button" data-time-filter="upcoming" class="time-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-warm-muted hover:text-warm-text transition-colors cursor-pointer">即將演出</button>
          <button type="button" data-time-filter="past" class="time-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-warm-muted hover:text-warm-text transition-colors cursor-pointer">已結束</button>
        </div>
      </div>
      <div id="cityFilterBar" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5"></div>
    </section>

    <!-- Event List -->
    <section id="eventListContainer" class="space-y-3.5">
      <div class="text-center py-12 text-warm-muted text-sm">正在從雲端同步載入演出資訊...</div>
    </section>

    <!-- Empty State -->
    <div id="emptyState" class="hidden bg-white border border-warm-border rounded-2xl p-10 text-center space-y-3">
      <h3 class="text-base font-semibold text-warm-text">找不到符合條件的演出場次</h3>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-warm-border bg-white mt-12">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-6 flex items-center justify-between text-xs text-warm-muted">
      <span class="font-display font-bold text-crimson-800">MOREBEUS</span>
      <span>雲端即時同步演出資訊總覽</span>
    </div>
  </footer>

  <!-- Add / Edit Modal -->
  <div id="eventModal" class="hidden fixed inset-0 z-50 bg-stone-950/50 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white border border-warm-border rounded-2xl max-w-2xl w-full shadow-xl overflow-hidden my-auto animate-card">
      <div class="px-5 py-4 border-b border-warm-border bg-warm-tint/70 flex items-center justify-between">
        <h2 id="eventModalTitle" class="text-base font-bold text-warm-text">新增演出資訊</h2>
        <button type="button" id="closeEventModalBtn" class="p-1.5 rounded-lg text-warm-muted hover:text-crimson-700 cursor-pointer">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12" stroke-linecap="round"/></svg>
        </button>
      </div>
      <form id="eventForm" class="p-5 space-y-4 max-h-[82vh] overflow-y-auto">
        <input type="hidden" id="fieldId" />
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
          <div class="sm:col-span-2">
            <label class="block text-xs font-medium text-warm-text mb-1">活動名稱 <span class="text-crimson-600">*</span></label>
            <input id="fieldTitle" type="text" required class="w-full px-3 py-2 rounded-lg border border-warm-border text-sm focus:outline-none focus:border-crimson-600" />
          </div>
          <div>
            <label class="block text-xs font-medium text-warm-text mb-1">演出狀態</label>
            <select id="fieldStatus" class="w-full px-3 py-2 rounded-lg border border-warm-border text-sm bg-white focus:outline-none focus:border-crimson-600">
              <option value="售票中">售票中</option><option value="即將開賣">即將開賣</option><option value="免費入場">免費入場</option><option value="已完售">已完售</option><option value="已結束">已結束</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
          <div><label class="block text-xs font-medium text-warm-text mb-1">日期 <span class="text-crimson-600">*</span></label><input id="fieldDate" type="date" required class="w-full px-3 py-2 rounded-lg border border-warm-border text-sm focus:outline-none focus:border-crimson-600" /></div>
          <div><label class="block text-xs font-medium text-warm-text mb-1">進場 (OPEN)</label><input id="fieldOpenTime" type="text" placeholder="19:00" class="w-full px-3 py-2 rounded-lg border border-warm-border text-sm focus:outline-none focus:border-crimson-600" /></div>
          <div><label class="block text-xs font-medium text-warm-text mb-1">開演 (START)</label><input id="fieldStartTime" type="text" placeholder="19:30" class="w-full px-3 py-2 rounded-lg border border-warm-border text-sm focus:outline-none focus:border-crimson-600" /></div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
          <div><label class="block text-xs font-medium text-warm-text mb-1">城市 <span class="text-crimson-600">*</span></label><input id="fieldCity" type="text" required placeholder="台北" class="w-full px-3 py-2 rounded-lg border border-warm-border text-sm focus:outline-none focus:border-crimson-600" /></div>
          <div class="sm:col-span-2"><label class="block text-xs font-medium text-warm-text mb-1">場館 <span class="text-crimson-600">*</span></label><input id="fieldVenue" type="text" required class="w-full px-3 py-2 rounded-lg border border-warm-border text-sm focus:outline-none focus:border-crimson-600" /></div>
        </div>
        <div><label class="block text-xs font-medium text-warm-text mb-1">地址</label><input id="fieldAddress" type="text" class="w-full px-3 py-2 rounded-lg border border-warm-border text-sm focus:outline-none focus:border-crimson-600" /></div>
        <div><label class="block text-xs font-medium text-warm-text mb-1">演出陣容 (逗號分隔)</label><input id="fieldLineup" type="text" class="w-full px-3 py-2 rounded-lg border border-warm-border text-sm focus:outline-none focus:border-crimson-600" /></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
          <div><label class="block text-xs font-medium text-warm-text mb-1">票價</label><input id="fieldPrice" type="text" class="w-full px-3 py-2 rounded-lg border border-warm-border text-sm focus:outline-none focus:border-crimson-600" /></div>
          <div><label class="block text-xs font-medium text-warm-text mb-1">購票連結</label><input id="fieldTicketUrl" type="url" class="w-full px-3 py-2 rounded-lg border border-warm-border text-sm focus:outline-none focus:border-crimson-600" /></div>
        </div>

        <!-- Setlist -->
        <div class="rounded-xl border border-crimson-200/80 bg-crimson-50/40 p-3.5 space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-xs font-bold text-warm-text">演出歌單 (Setlist)</h3>
            <label class="inline-flex items-center gap-1.5 text-xs cursor-pointer bg-white px-2.5 py-1 rounded-lg border border-warm-border">
              <input id="fieldSetlistHidden" type="checkbox" class="accent-crimson-700" /><span>演出前保密</span>
            </label>
          </div>
          <div id="setlistEditorRows" class="space-y-2"></div>
          <button type="button" id="addSongRowBtn" class="px-3 py-1 rounded-lg bg-white border border-crimson-200 text-xs text-crimson-700 cursor-pointer">+ 新增歌曲</button>
        </div>

        <div><label class="block text-xs font-medium text-warm-text mb-1">備註</label><textarea id="fieldNotes" rows="2" class="w-full px-3 py-2 rounded-lg border border-warm-border text-sm focus:outline-none focus:border-crimson-600"></textarea></div>
        <div class="pt-2 border-t border-warm-border flex justify-end gap-2">
          <button type="button" id="cancelEventModalBtn" class="px-4 py-2 rounded-lg border border-warm-border text-sm text-warm-muted cursor-pointer">取消</button>
          <button type="submit" class="px-5 py-2 rounded-lg bg-crimson-700 text-white text-sm font-medium hover:bg-crimson-800 cursor-pointer">儲存至雲端</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Header Modal -->
  <div id="headerModal" class="hidden fixed inset-0 z-50 bg-stone-950/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white border border-warm-border rounded-2xl max-w-lg w-full shadow-xl p-5 space-y-4">
      <h2 class="text-base font-bold text-warm-text">修改標題與公告</h2>
      <form id="headerForm" class="space-y-3">
        <div><label class="block text-xs font-medium mb-1">主標題</label><input id="headerTitleInput" type="text" required class="w-full px-3 py-2 rounded-lg border border-warm-border text-sm" /></div>
        <div><label class="block text-xs font-medium mb-1">公告內容</label><textarea id="headerAnnouncementInput" rows="3" class="w-full px-3 py-2 rounded-lg border border-warm-border text-sm"></textarea></div>
        <div class="flex justify-end gap-2 pt-2"><button type="button" id="cancelHeaderModalBtn" class="px-4 py-2 text-xs border rounded-lg">取消</button><button type="submit" class="px-4 py-2 text-xs bg-crimson-700 text-white rounded-lg">儲存</button></div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 pointer-events-none opacity-0 translate-y-2 transition-all duration-200">
    <div class="bg-stone-900 text-white text-xs sm:text-sm px-4 py-2.5 rounded-xl shadow-lg flex items-center gap-2 border border-crimson-800/40">
      <span class="w-2 h-2 rounded-full bg-crimson-400"></span>
      <span id="toastMessage">已同步</span>
    </div>
  </div>

  <script>
    // ==========================================
    // 請在此處填入您的 JSONBin 設定
    // ==========================================
    const JSONBIN_BIN_ID = "6afb1b9cac6210605a8c35c6";
    const JSONBIN_API_KEY = "$2a$10$XgIv7VzSD9M.Y/QXcKjIDOL0wSzyp48VzBdM.D4.fuClOadKw2ssi";
    // ==========================================

    (function () {
      const WEEKDAYS = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
      let appData = { siteMeta: { title: "MOREBEUS", subtitle: "2026 Live Schedule", announcement: "載入中..." }, events: [] };
      let isEditMode = false;
      let selectedCity = '全部';
      let selectedTimeFilter = 'all';
      let searchQuery = '';
      let expandedSetlistIds = new Set();
      let draftSetlist = [];

      const siteTitleDisplay = document.getElementById('siteTitleDisplay');
      const siteSubtitleDisplay = document.getElementById('siteSubtitleDisplay');
      const announcementText = document.getElementById('announcementText');
      const lastUpdatedLabel = document.getElementById('lastUpdatedLabel');
      const totalCountStat = document.getElementById('totalCountStat');
      const upcomingCountStat = document.getElementById('upcomingCountStat');
      const cityFilterBar = document.getElementById('cityFilterBar');
      const eventListContainer = document.getElementById('eventListContainer');
      const emptyState = document.getElementById('emptyState');
      const searchInput = document.getElementById('searchInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');
      const editBanner = document.getElementById('editBanner');
      const toggleEditModeBtn = document.getElementById('toggleEditModeBtn');
      const editModeLabel = document.getElementById('editModeLabel');

      async function fetchFromCloud() {
        if (!JSONBIN_BIN_ID || JSONBIN_BIN_ID.includes("請貼上")) {
          alert("尚未設定 JSONBin Bin ID，請修改程式碼底部的設定！");
          return;
        }
        try {
          const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
            headers: { "X-Master-Key": JSONBIN_API_KEY }
          });
          const json = await res.json();
          if (json && json.record) {
            appData = json.record;
            renderAll();
          }
        } catch (err) {
          console.error("雲端載入失敗", err);
          showToast("雲端載入失敗，請檢查網路或設定");
        }
      }

      async function saveToCloud() {
        const now = new Date();
        appData.siteMeta.lastUpdated = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;
        try {
          showToast("正在同步至雲端...");
          const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              "X-Master-Key": JSONBIN_API_KEY
            },
            body: JSON.stringify(appData)
          });
          if (res.ok) {
            showToast("已成功同步至雲端！其他人重新整理即可看到");
            renderAll();
          } else {
            throw new Error("儲存失敗");
          }
        } catch (err) {
          console.error(err);
          alert("同步雲端失敗，請檢查 API Key 是否正確。");
        }
      }

      function showToast(msg) {
        const toast = document.getElementById('toast');
        document.getElementById('toastMessage').textContent = msg;
        toast.classList.remove('opacity-0', 'translate-y-2');
        toast.classList.add('opacity-100', 'translate-y-0');
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(() => {
          toast.classList.add('opacity-0', 'translate-y-2');
          toast.classList.remove('opacity-100', 'translate-y-0');
        }, 2600);
      }

      function getTodayStr() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      }

      function isEventPast(ev) {
        if (ev.status === '已結束') return true;
        if (!ev.date) return false;
        return ev.date < getTodayStr();
      }

      function formatDateParts(dateStr) {
        if (!dateStr) return { year: '----', monthDay: '--/--', weekday: '' };
        const [y, m, d] = dateStr.split('-').map(Number);
        const dt = new Date(y, (m || 1) - 1, d || 1);
        return { year: String(y), monthDay: `${String(m).padStart(2, '0')}/${String(d).padStart(2, '0')}`, weekday: WEEKDAYS[dt.getDay()] || '' };
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function renderAll() {
        siteTitleDisplay.textContent = appData.siteMeta.title || 'MOREBEUS';
        siteSubtitleDisplay.textContent = appData.siteMeta.subtitle || '';
        announcementText.textContent = appData.siteMeta.announcement || '';
        lastUpdatedLabel.textContent = `最後更新：${appData.siteMeta.lastUpdated || '-'}`;

        const total = (appData.events || []).length;
        const upcoming = (appData.events || []).filter(ev => !isEventPast(ev)).length;
        totalCountStat.textContent = total;
        upcomingCountStat.textContent = upcoming;

        // Cities
        const cities = ['全部'];
        (appData.events || []).forEach(ev => {
          const c = (ev.city || '').trim();
          if (c && !cities.includes(c)) cities.push(c);
        });
        if (!cities.includes(selectedCity)) selectedCity = '全部';

        cityFilterBar.innerHTML = cities.map(city => {
          const active = city === selectedCity;
          const count = city === '全部' ? total : (appData.events || []).filter(e => (e.city || '').trim() === city).length;
          return `<button type="button" data-city="${escapeHtml(city)}" class="city-pill inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium border cursor-pointer ${active ? 'bg-crimson-700 text-white border-crimson-700' : 'bg-white text-warm-muted border-warm-border'}">${escapeHtml(city)} <span class="text-[11px]">${count}</span></button>`;
        }).join('');

        cityFilterBar.querySelectorAll('.city-pill').forEach(btn => {
          btn.addEventListener('click', () => { selectedCity = btn.dataset.city; renderEvents(); });
        });

        renderEvents();
      }

      function renderEvents() {
        const q = searchQuery.trim().toLowerCase();
        const events = appData.events || [];

        const filtered = events.filter(ev => {
          const past = isEventPast(ev);
          if (selectedTimeFilter === 'upcoming' && past) return false;
          if (selectedTimeFilter === 'past' && !past) return false;
          if (selectedCity !== '全部' && (ev.city || '').trim() !== selectedCity) return false;
          if (q) {
            const haystack = [ev.title, ev.city, ev.venue, ev.address, ev.price, ev.notes, ...(ev.lineup || [])].join(' ').toLowerCase();
            if (!haystack.includes(q)) return false;
          }
          return true;
        });

        if (filtered.length === 0) {
          eventListContainer.innerHTML = '';
          emptyState.classList.remove('hidden');
          return;
        }

        emptyState.classList.add('hidden');

        eventListContainer.innerHTML = filtered.map(ev => {
          const realIndex = events.findIndex(item => item.id === ev.id);
          const past = isEventPast(ev);
          const { year, monthDay, weekday } = formatDateParts(ev.date);
          const displayStatus = past && ev.status !== '已結束' ? '已結束' : (ev.status || '售票中');
          const songs = ev.setlist || [];
          const canViewSetlist = songs.length > 0 && (!ev.setlistHidden || isEditMode);
          const isSetlistExpanded = expandedSetlistIds.has(ev.id);

          return `
            <article class="animate-card bg-white border border-warm-border rounded-2xl p-4 sm:p-5 shadow-2xs">
              <div class="flex flex-col md:flex-row md:items-start gap-4">
                <div class="flex md:flex-col items-baseline md:items-center justify-between md:w-28 shrink-0 pb-3 md:pb-0 border-b md:border-b-0 md:border-r border-warm-border md:pr-4">
                  <span class="text-xs text-warm-subtle">${year}</span>
                  <span class="font-display text-xl sm:text-2xl font-bold ${past ? 'text-warm-muted' : 'text-crimson-700'}">${monthDay}</span>
                  <span class="text-xs text-warm-muted">${weekday}</span>
                  <span class="px-2 py-0.5 rounded-full text-[11px] border bg-stone-50">${displayStatus}</span>
                </div>
                <div class="flex-1 min-w-0 space-y-2">
                  <h2 class="text-base sm:text-lg font-bold text-warm-text">${escapeHtml(ev.title)}</h2>
                  <p class="text-xs sm:text-sm text-warm-muted">📍 ${escapeHtml(ev.venue)} | ⏰ ${escapeHtml(ev.openTime)} OPEN</p>
                  ${ev.lineup ? `<p class="text-xs text-warm-subtle">陣容：${ev.lineup.join('、')}</p>` : ''}
                  
                  ${canViewSetlist ? `
                    <div class="pt-2 border-t border-warm-border/70">
                      <button type="button" data-action="toggle-setlist" data-id="${ev.id}" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-crimson-50 text-crimson-800 border border-crimson-200 cursor-pointer">
                        🎵 演出歌單（共 ${songs.length} 首） ${isSetlistExpanded ? '▲' : '▼'}
                      </button>
                      ${isSetlistExpanded ? `
                        <ol class="mt-2 grid grid-cols-1 sm:grid-cols-2 gap-2 bg-warm-tint p-3 rounded-xl text-xs">
                          ${songs.map((s, i) => `<li>${i+1}. ${escapeHtml(s.title)} ${s.note ? `(${s.note})` : ''}</li>`).join('')}
                        </ol>
                      ` : ''}
                    </div>
                  ` : ''}
                </div>
                <div class="flex items-center gap-2">
                  ${isEditMode ? `
                    <button type="button" data-action="edit" data-id="${ev.id}" class="px-3 py-1.5 rounded-lg border bg-white text-xs cursor-pointer">編輯</button>
                    <button type="button" data-action="delete" data-id="${ev.id}" class="px-3 py-1.5 rounded-lg border border-crimson-200 bg-crimson-50 text-crimson-700 text-xs cursor-pointer">刪除</button>
                  ` : ''}
                </div>
              </div>
            </article>
          `;
        }).join('');
      }

      // Edit Mode Toggle
      toggleEditModeBtn.addEventListener('click', () => {
        isEditMode = !isEditMode;
        editBanner.classList.toggle('hidden', !isEditMode);
        editModeLabel.textContent = isEditMode ? '編輯中' : '編輯模式';
        renderEvents();
      });
      document.getElementById('bannerCloseEditBtn').addEventListener('click', () => { isEditMode = false; editBanner.classList.add('hidden'); renderEvents(); });

      // Modal Handling
      const eventModal = document.getElementById('eventModal');
      const eventForm = document.getElementById('eventForm');
      let draftSetlist = [];

      function openModal(ev = null) {
        if (ev) {
          document.getElementById('fieldId').value = ev.id;
          document.getElementById('fieldTitle').value = ev.title || '';
          document.getElementById('fieldStatus').value = ev.status || '售票中';
          document.getElementById('fieldDate').value = ev.date || '';
          document.getElementById('fieldOpenTime').value = ev.openTime || '';
          document.getElementById('fieldStartTime').value = ev.startTime || '';
          document.getElementById('fieldCity').value = ev.city || '';
          document.getElementById('fieldVenue').value = ev.venue || '';
          document.getElementById('fieldAddress').value = ev.address || '';
          document.getElementById('fieldLineup').value = (ev.lineup || []).join('、');
          document.getElementById('fieldPrice').value = ev.price || '';
          document.getElementById('fieldTicketUrl').value = ev.ticketUrl || '';
          document.getElementById('fieldNotes').value = ev.notes || '';
          document.getElementById('fieldSetlistHidden').checked = Boolean(ev.setlistHidden);
          draftSetlist = (ev.setlist || []).map(s => ({ ...s }));
        } else {
          eventForm.reset();
          document.getElementById('fieldId').value = '';
          document.getElementById('fieldDate').value = getTodayStr();
          draftSetlist = [];
        }
        renderSetlistEditor();
        eventModal.classList.remove('hidden');
      }

      function renderSetlistEditor() {
        const rows = document.getElementById('setlistEditorRows');
        rows.innerHTML = draftSetlist.map((s, i) => `
          <div class="flex gap-2">
            <input type="text" value="${escapeHtml(s.title)}" placeholder="曲名" oninput="window.__updateSong(${i}, 'title', this.value)" class="flex-1 px-2 py-1 text-xs border rounded" />
            <input type="text" value="${escapeHtml(s.note)}" placeholder="備註" oninput="window.__updateSong(${i}, 'note', this.value)" class="w-24 px-2 py-1 text-xs border rounded" />
            <button type="button" onclick="window.__removeSong(${i})" class="text-crimson-600 text-xs px-2">刪除</button>
          </div>
        `).join('') || '<div class="text-xs text-warm-muted">尚無曲目</div>';
      }
      window.__updateSong = (i, f, v) => { draftSetlist[i][f] = v; };
      window.__removeSong = (i) => { draftSetlist.splice(i, 1); renderSetlistEditor(); };

      document.getElementById('addSongRowBtn').addEventListener('click', () => { draftSetlist.push({ title: '', note: '' }); renderSetlistEditor(); });
      document.getElementById('openAddModalBtn').addEventListener('click', () => openModal(null));
      document.getElementById('closeEventModalBtn').addEventListener('click', () => eventModal.classList.add('hidden'));
      document.getElementById('cancelEventModalBtn').addEventListener('click', () => eventModal.classList.add('hidden'));

      eventForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('fieldId').value;
        const payload = {
          id: id || `evt-${Date.now()}`,
          title: document.getElementById('fieldTitle').value.trim(),
          status: document.getElementById('fieldStatus').value,
          date: document.getElementById('fieldDate').value,
          openTime: document.getElementById('fieldOpenTime').value.trim(),
          startTime: document.getElementById('fieldStartTime').value.trim(),
          city: document.getElementById('fieldCity').value.trim(),
          venue: document.getElementById('fieldVenue').value.trim(),
          address: document.getElementById('fieldAddress').value.trim(),
          lineup: document.getElementById('fieldLineup').value.split(/[,，、]/).map(s => s.trim()).filter(Boolean),
          price: document.getElementById('fieldPrice').value.trim(),
          ticketUrl: document.getElementById('fieldTicketUrl').value.trim(),
          notes: document.getElementById('fieldNotes').value.trim(),
          setlistHidden: document.getElementById('fieldSetlistHidden').checked,
          setlist: draftSetlist.filter(s => s.title.trim())
        };

        if (id) {
          const idx = appData.events.findIndex(item => item.id === id);
          if (idx !== -1) appData.events[idx] = payload;
        } else {
          appData.events.unshift(payload);
        }

        eventModal.classList.add('hidden');
        await saveToCloud();
      });

      eventListContainer.addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.dataset.action;
        const id = btn.dataset.id;

        if (action === 'toggle-setlist') {
          if (expandedSetlistIds.has(id)) expandedSetlistIds.delete(id);
          else expandedSetlistIds.add(id);
          renderEvents();
        } else if (action === 'edit') {
          const ev = appData.events.find(item => item.id === id);
          if (ev) openModal(ev);
        } else if (action === 'delete') {
          if (confirm('確定要刪除此場次嗎？')) {
            appData.events = appData.events.filter(item => item.id !== id);
            await saveToCloud();
          }
        }
      });

      // Search & Filters
      searchInput.addEventListener('input', (e) => { searchQuery = e.target.value; clearSearchBtn.classList.toggle('hidden', !searchQuery); renderEvents(); });
      clearSearchBtn.addEventListener('click', () => { searchQuery = ''; searchInput.value = ''; clearSearchBtn.classList.add('hidden'); renderEvents(); });
      document.querySelectorAll('.time-filter-btn').forEach(b => {
        b.addEventListener('click', () => {
          selectedTimeFilter = b.dataset.timeFilter;
          document.querySelectorAll('.time-filter-btn').forEach(btn => btn.classList.replace('bg-crimson-700', 'text-warm-muted') || btn.classList.remove('text-white'));
          b.classList.add('bg-crimson-700', 'text-white');
          b.classList.remove('text-warm-muted');
          renderEvents();
        });
      });

      // Header Edit Modal
      const headerModal = document.getElementById('headerModal');
      document.getElementById('editHeaderInfoBtn').addEventListener('click', () => {
        document.getElementById('headerTitleInput').value = appData.siteMeta.title;
        document.getElementById('headerAnnouncementInput').value = appData.siteMeta.announcement;
        headerModal.classList.remove('hidden');
      });
      document.getElementById('cancelHeaderModalBtn').addEventListener('click', () => headerModal.classList.add('hidden'));
      document.getElementById('headerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        appData.siteMeta.title = document.getElementById('headerTitleInput').value.trim();
        appData.siteMeta.announcement = document.getElementById('headerAnnouncementInput').value.trim();
        headerModal.classList.add('hidden');
        await saveToCloud();
      });

      document.getElementById('forceSyncBtn').addEventListener('click', fetchFromCloud);

      // Initial fetch
      fetchFromCloud();
    })();
  </script>
</body>
</html>
